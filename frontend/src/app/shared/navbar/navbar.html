<nav class="navbar navbar-expand-lg" aria-label="Main navigation">
  <div class="container-fluid nav-shell">
    <a class="navbar-brand" routerLink="/feed"><span class="brand-mark">01</span>Blog</a>
    <button class="navbar-toggler" type="button" (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()" aria-controls="main-menu" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="main-menu" class="collapse navbar-collapse" [class.show]="menuOpen()">
      <div class="navbar-nav">
        <a class="nav-link" routerLink="/feed" routerLinkActive="active">Home</a>
        <a class="nav-link" routerLink="/discover" routerLinkActive="active">Discover Users</a>
        <a class="nav-link" routerLink="/my-posts" routerLinkActive="active">My Posts</a>
        <a class="nav-link" routerLink="/create-post" routerLinkActive="active">Create Post</a>
        <a routerLink="/notifications" routerLinkActive="active" class="nav-link notifications-link"
          [attr.aria-label]="notifications.error() ? 'Notifications, could not refresh' : (notifications.loaded() ? 'Notifications, ' + notifications.unreadCount() + ' unread' : 'Notifications')">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
          </svg>
          Notifications
          @if (notifications.loaded() && notifications.unreadCount() > 0) {
            <span class="notification-count badge text-bg-primary" aria-hidden="true">{{ notifications.unreadCount() }}</span>
          }
          @if (notifications.error()) { <span class="notification-warning" aria-hidden="true" title="Could not refresh notifications">!</span> }
        </a>
        <a class="nav-link" [routerLink]="['/profile', currentUserId]" routerLinkActive="active">My Profile</a>
        <a class="nav-link" *ngIf="role === 'ADMIN'" routerLink="/admin" routerLinkActive="active">Admin</a>
      </div>
      <button class="btn btn-outline-secondary logout" type="button" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>
