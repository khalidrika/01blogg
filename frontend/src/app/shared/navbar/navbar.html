<nav aria-label="Main navigation">
  <a routerLink="/feed">Home</a>
  <a routerLink="/discover">Discover Users</a>
  <a routerLink="/create-post">Create Post</a>
  <a routerLink="/notifications" class="notifications-link"
    [attr.aria-label]="notifications.error() ? 'Notifications, could not refresh' : (notifications.loaded() ? 'Notifications, ' + notifications.unreadCount() + ' unread' : 'Notifications')">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
    </svg>
    Notifications
    @if (notifications.loaded() && notifications.unreadCount() > 0) {
      <span class="notification-count" aria-hidden="true">{{ notifications.unreadCount() }}</span>
    }
    @if (notifications.error()) {
      <span class="notification-warning" aria-hidden="true" title="Could not refresh notifications">!</span>
    }
  </a>
  <a [routerLink]="['/profile', currentUserId]">My Profile</a>
  <a *ngIf="role === 'ADMIN'" routerLink="/admin">Admin</a>
  <button type="button" (click)="logout()">Logout</button>
</nav>
