<main class="auth-page">
  <h1>Create your 01Blog account</h1>
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  <form #form="ngForm" (ngSubmit)="form.valid && register()">
    <label class="form-label" for="username">Username</label>
    <input class="form-control" id="username" name="username" [(ngModel)]="username" required maxlength="50" autocomplete="username">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" type="email" name="email" [(ngModel)]="email" required email maxlength="254" autocomplete="email">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" type="password" name="password" [(ngModel)]="password" required minlength="6" maxlength="72" autocomplete="new-password" aria-describedby="password-help">
    <small id="password-help">Use at least 6 characters and no more than 72 UTF-8 bytes.</small>
    <label class="form-label" for="confirm-password">Confirm password</label>
    <input class="form-control" id="confirm-password" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required autocomplete="new-password">
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || pending()">{{ pending() ? 'Creating account...' : 'Create account' }}</button>
  </form>
  <p>Already registered? <a routerLink="/login">Log in</a></p>
</main>
